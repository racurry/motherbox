[tools]
node = "24"
python = "3.14"
go = "1.26"
pnpm = "11"
uv = "latest"

# Global tools - node
# These would otherwise pull a Homebrew-managed Node runtime, or need fresher
# releases than Homebrew provides and do not have a first-party installer.
"npm:@google/gemini-cli" = "latest"
"npm:skills" = "latest"
"npm:@devcontainers/cli" = "latest"
"npm:@agentclientprotocol/claude-agent-acp" = "latest"
# better-sqlite3 is a native module; pnpm blocks build scripts by default, so
# whitelist its build to get the compiled binding (needs pnpm >= 10.4.0).
"npm:obsidian-headless" = { version = "latest", allow_builds = ["better-sqlite3"] }

# Global tools - python
# These would normally use homebrew, but they all pull in a brew python.  So, mise it is
"pipx:yamllint" = "latest"
"pipx:ocrmypdf" = "latest"
"pipx:mdformat" = { version = "latest", uvx_args = "--with mdformat-gfm --with mdformat-frontmatter" }
"pipx:llm" = { version = "latest", uvx_args = "--with llm-cmd --with llm-gemini" }

[settings.python]
uv_venv_auto = "create|source"
github_attestations = false

[settings.pipx]
uvx = true

[settings.npm]
package_manager = "pnpm"
